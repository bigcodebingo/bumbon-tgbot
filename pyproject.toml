[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bumbon-tgbot"
version = "0.1.0"
description = "Бумбон"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3,<4",
    "python-dotenv>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]